<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TablePulse — Visitor & Dining Survey Platform</title>
    <meta name="description" content="Interactive dining and visitor survey platform with live analytics dashboard, date tracking, and automatic CSV export." />
    <meta property="og:title" content="TablePulse — Visitor & Dining Survey Platform" />
    <meta property="og:description" content="Interactive dining and visitor survey platform with live analytics dashboard, date tracking, and automatic CSV export." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="./assets/aistudio/JIANGNAN_LOGO_RBLACK_TRANSPARENT_781766e1.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-red-100 selection:text-red-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
        var viteClient = document.querySelector('script[src*="@vite/client"]');
        if (!rawEntry || viteClient) return;
        rawEntry.remove();

        var style = document.createElement('style');
        style.textContent =
          'html{font-family:"DM Sans",ui-sans-serif,system-ui,sans-serif;scroll-behavior:smooth}' +
          'h1,h2,h3,h4{font-family:"Plus Jakarta Sans",ui-sans-serif,system-ui,sans-serif}' +
          '.font-mono{font-family:"JetBrains Mono",ui-monospace,monospace}' +
          '.tabular-nums{font-variant-numeric:tabular-nums}';
        document.head.appendChild(style);

        function loadScript(src) {
          return new Promise(function (resolve, reject) {
            var s = document.createElement('script');
            s.src = src;
            s.onload = resolve;
            s.onerror = reject;
            document.head.appendChild(s);
          });
        }

        Promise.all([
          loadScript('https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4'),
          loadScript('https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.9/babel.min.js')
        ]).then(async function () {
          var files = [
            'src/types/survey.ts',
            'src/utils/surveyStorage.ts',
            'src/components/Icons.tsx',
            'src/components/Header.tsx',
            'src/components/SurveyFlow.tsx',
            'src/components/DashboardView.tsx',
            'src/App.tsx',
            'src/main.tsx'
          ];
          var sources = {};
          await Promise.all(
            files.map(async function (f) {
              var res = await fetch('./' + f, { cache: 'no-store' });
              sources[f] = await res.text();
            })
          );

          var blobs = {};
          var importMap = {
            'react': 'https://esm.sh/react@19.0.1',
            'react-dom/client': 'https://esm.sh/react-dom@19.0.1/client',
            'lucide-react': 'https://esm.sh/lucide-react@0.546.0?deps=react@19.0.1',
            '../types/survey': function () { return blobs['src/types/survey.ts']; },
            './types/survey': function () { return blobs['src/types/survey.ts']; },
            '../utils/surveyStorage': function () { return blobs['src/utils/surveyStorage.ts']; },
            './utils/surveyStorage': function () { return blobs['src/utils/surveyStorage.ts']; },
            './Icons': function () { return blobs['src/components/Icons.tsx']; },
            './components/Header': function () { return blobs['src/components/Header.tsx']; },
            './components/SurveyFlow': function () { return blobs['src/components/SurveyFlow.tsx']; },
            './components/DashboardView': function () { return blobs['src/components/DashboardView.tsx']; },
            './App.tsx': function () { return blobs['src/App.tsx']; }
          };

          for (var i = 0; i < files.length; i++) {
            var file = files[i];
            var raw = sources[file].replace(/import\s+['"]\.\/index\.css['"];?/g, '');
            var transpiled = window.Babel.transform(raw, {
              filename: file,
              presets: [
                'react',
                ['typescript', { isTSX: true, allExtensions: true }]
              ]
            }).code;

            var resolved = transpiled.replace(
              /(from\s+['"])([^'"]+)(['"])/g,
              function (_, p1, spec, p3) {
                var target = importMap[spec];
                var url = typeof target === 'function' ? target() : target || spec;
                return p1 + url + p3;
              }
            );

            blobs[file] = URL.createObjectURL(
              new Blob([resolved], { type: 'text/javascript' })
            );
          }

          var entry = document.createElement('script');
          entry.type = 'module';
          entry.src = blobs['src/main.tsx'];
          document.body.appendChild(entry);
        });
      })();
    </script>
  </body>
</html>
