    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-red-100 selection:text-red-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var rawEntry = document.querySelector('script[src="/src/main.tsx"]');
        var viteClient = document.querySelector('script[src*="@vite/client"]');
        if (!rawEntry || viteClient) return;
        rawEntry.remove();

        var basePath = window.location.pathname
          .replace(/\/index\.html$/i, '/')
          .replace(/\/?$/, '/');
        var baseUrl = window.location.origin + basePath;
        var cacheBust = 'v=firestore-sync-16';

        var cssLink = document.createElement('link');
        cssLink.rel = 'stylesheet';
        cssLink.href = baseUrl + 'docs/gh-pages.css?' + cacheBust;
        document.head.appendChild(cssLink);

        var entry = document.createElement('script');
        entry.type = 'module';
        entry.src = baseUrl + 'docs/main.js?' + cacheBust;
        document.body.appendChild(entry);
      })();
    </script>
  </body>
</html>
